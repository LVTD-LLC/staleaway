name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "16"
      - run: npm ci --include=dev && npm run test:analytics && npm run test:planner && npm run build
      - run: docker compose -f docker-compose-test.yml build
      - run: make test
      - name: Render public blog previews from isolated fixtures
        run: docker compose -f docker-compose-test.yml run --rm backend python scripts/render_blog_previews.py
      - name: Upload public preview for pre-merge visual review
        uses: actions/upload-artifact@v4
        with:
          name: public-blog-preview
          path: build/blog-preview/
          retention-days: 7
